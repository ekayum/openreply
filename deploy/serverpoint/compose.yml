# OpenReply for Dr Nisa on the ServerPoint VPS.
#
# Run from /opt/openreply/deploy/serverpoint:
#   docker compose up -d --build
#
# Separate project from the Hermes and Honcho containers on this host.
# Postgres and Redis get no host ports (Honcho already uses 127.0.0.1:5432
# and :6379), so only Caddy is reachable from outside, on 80 and 443.

name: openreply

x-app: &app
  image: openreply:local
  env_file: .env
  environment:
    NODE_ENV: production
    HOSTNAME: 0.0.0.0
    DATABASE_URL: postgresql://openreply:${POSTGRES_PASSWORD}@postgres:5432/openreply
    REDIS_URL: redis://redis:6379
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreply -d openreply"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on: the send queue must survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    build:
      context: ../..
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: ["npm", "run", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Any HTTP answer means Next is up. /api/health is not used here: it
      # returns 503 until the worker heartbeats, which would hold back cron.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  cron:
    <<: *app
    command: ["sh", "scripts/cron.sh"]
    environment:
      CRON_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPENREPLY_DOMAIN: ${OPENREPLY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
